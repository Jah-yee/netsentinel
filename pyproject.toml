[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
version = "1.0.0"
description = "Detection engine suite - rules NIDS, ML flow-anomaly, kernel watchdog, MITM detectors, SIEM-lite correlation, alert API (offline/fixture-first)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "5h4d0wn1k"}]
keywords = ["nids", "snort", "suricata", "siem", "ids", "anomaly-detection", "mitm", "kernel-watch", "intrusion-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
netsentinel = "netsentinel.cli:main"

[project.entry-points.console_scripts]
netsentinel = "netsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["netsentinel*"]

[tool.setuptools.package-data]
netsentinel = ["data/*.rules", "data/*.json", "data/*.yaml"]